<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">RealSense 드론 비전 파이프라인</title>
  <desc id="desc">RealSense RGB-D 입력부터 표식 검출과 추적, 측정 유효성 게이트, 좌표 변환, 원자적 JSON과 Bridge 전달까지의 흐름</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071827"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.32"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7dd3fc"/>
    </marker>
    <style>
      .sans{font-family:"Pretendard","Noto Sans KR","Malgun Gothic",Arial,sans-serif}
      .title{font-size:38px;font-weight:800;fill:#f8fafc}
      .subtitle{font-size:17px;font-weight:500;fill:#a7b3c2}
      .step{font-size:13px;font-weight:800;letter-spacing:1px;fill:#5eead4}
      .heading{font-size:22px;font-weight:800;fill:#f8fafc}
      .body{font-size:15px;font-weight:500;fill:#cbd5e1}
      .small{font-size:13px;font-weight:600;fill:#9aa9bc}
      .chip{font-size:13px;font-weight:800;fill:#dbeafe}
    </style>
  </defs>

  <rect width="1200" height="720" rx="30" fill="url(#bg)"/>
  <circle cx="1060" cy="90" r="210" fill="#0ea5e9" opacity="0.06"/>
  <circle cx="120" cy="680" r="230" fill="#14b8a6" opacity="0.05"/>

  <g class="sans">
    <text x="72" y="72" class="title">RealSense 드론 비전 파이프라인</text>
    <rect x="72" y="92" width="760" height="5" rx="3" fill="url(#hero)"/>
    <text x="72" y="128" class="subtitle">RGB-D 영상 → 표식 검출·추적 → 유효성 판정 → 기체 좌표 → 비행 애플리케이션 전달</text>

    <!-- Stage 1 -->
    <g filter="url(#shadow)">
      <rect x="72" y="182" width="202" height="244" rx="22" fill="#101d2b" stroke="#24536b" stroke-width="2"/>
      <rect x="90" y="202" width="70" height="27" rx="14" fill="#10364a"/>
      <text x="104" y="220" class="step">01 · 입력</text>
      <rect x="102" y="255" width="142" height="86" rx="14" fill="#0b2635" stroke="#2dd4bf" stroke-width="2"/>
      <circle cx="173" cy="298" r="28" fill="none" stroke="#67e8f9" stroke-width="5"/>
      <circle cx="173" cy="298" r="11" fill="#2dd4bf" opacity="0.85"/>
      <rect x="124" y="347" width="98" height="9" rx="4" fill="#235369"/>
      <text x="102" y="385" class="heading">Intel D435</text>
      <text x="102" y="408" class="body">RGB · 정렬 Depth</text>
    </g>

    <!-- Stage 2 -->
    <g filter="url(#shadow)">
      <rect x="310" y="182" width="202" height="244" rx="22" fill="#101d2b" stroke="#24536b" stroke-width="2"/>
      <rect x="328" y="202" width="76" height="27" rx="14" fill="#10364a"/>
      <text x="342" y="220" class="step">02 · 인식</text>
      <rect x="340" y="257" width="142" height="82" rx="12" fill="#0b2635" stroke="#60a5fa" stroke-width="2"/>
      <path d="M354 315h30v-22h25v-16h25v28h34" fill="none" stroke="#93c5fd" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="352" y="350" width="118" height="30" rx="15" fill="#122f45"/>
      <text x="364" y="370" class="chip">SSDLite / NCNN</text>
      <text x="340" y="402" class="heading">검출 + LK 추적</text>
    </g>

    <!-- Stage 3 -->
    <g filter="url(#shadow)">
      <rect x="548" y="182" width="202" height="244" rx="22" fill="#101d2b" stroke="#24536b" stroke-width="2"/>
      <rect x="566" y="202" width="88" height="27" rx="14" fill="#10364a"/>
      <text x="580" y="220" class="step">03 · 게이트</text>
      <circle cx="649" cy="291" r="48" fill="#0b2635" stroke="#34d399" stroke-width="3"/>
      <path d="M626 291l15 15 32-38" fill="none" stroke="#6ee7b7" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="578" y="365" class="heading">LandingGate</text>
      <text x="578" y="391" class="body">CONFIRMED · go</text>
      <text x="578" y="413" class="small">fresh detection + depth</text>
    </g>

    <!-- Stage 4 -->
    <g filter="url(#shadow)">
      <rect x="786" y="182" width="202" height="244" rx="22" fill="#101d2b" stroke="#24536b" stroke-width="2"/>
      <rect x="804" y="202" width="88" height="27" rx="14" fill="#10364a"/>
      <text x="818" y="220" class="step">04 · 좌표</text>
      <g transform="translate(887 293)">
        <line x1="0" y1="0" x2="0" y2="-48" stroke="#f87171" stroke-width="5" marker-end="url(#arrow)"/>
        <line x1="0" y1="0" x2="52" y2="0" stroke="#60a5fa" stroke-width="5" marker-end="url(#arrow)"/>
        <line x1="0" y1="0" x2="-37" y2="37" stroke="#34d399" stroke-width="5" marker-end="url(#arrow)"/>
        <text x="8" y="-38" class="small" fill="#fecaca">F</text>
        <text x="43" y="-10" class="small" fill="#bfdbfe">R</text>
        <text x="-47" y="54" class="small" fill="#bbf7d0">D</text>
      </g>
      <text x="816" y="365" class="heading">Depth → 3D</text>
      <text x="816" y="391" class="body">카메라 → body-FRD</text>
      <text x="816" y="413" class="small">착륙 표식 상대 오프셋</text>
    </g>

    <!-- Stage 5 -->
    <g filter="url(#shadow)">
      <rect x="1024" y="182" width="104" height="244" rx="22" fill="#101d2b" stroke="#24536b" stroke-width="2"/>
      <rect x="1042" y="202" width="68" height="27" rx="14" fill="#10364a"/>
      <text x="1054" y="220" class="step">05</text>
      <path d="M1052 260h48l14 14v62h-62z" fill="#0b2635" stroke="#a78bfa" stroke-width="2"/>
      <path d="M1100 260v15h14" fill="none" stroke="#c4b5fd" stroke-width="2"/>
      <text x="1060" y="303" class="chip">JSON</text>
      <text x="1045" y="367" class="heading">전달</text>
      <text x="1045" y="392" class="small">atomic latest</text>
      <text x="1045" y="412" class="small">Bridge.notify</text>
    </g>

    <!-- arrows -->
    <g fill="none" stroke="#7dd3fc" stroke-width="4" marker-end="url(#arrow)">
      <path d="M278 304h25"/>
      <path d="M516 304h25"/>
      <path d="M754 304h25"/>
      <path d="M992 304h25"/>
    </g>

    <!-- Safety and evidence strip -->
    <rect x="72" y="476" width="1056" height="168" rx="24" fill="#0d1b28" stroke="#1f4258" stroke-width="2"/>
    <text x="104" y="519" class="step">유효한 측정값의 조건</text>
    <g>
      <rect x="104" y="542" width="190" height="45" rx="12" fill="#10303e"/>
      <text x="128" y="570" class="chip">표식 검출 · 최신 프레임</text>
      <text x="314" y="570" class="heading">+</text>
      <rect x="344" y="542" width="168" height="45" rx="12" fill="#10303e"/>
      <text x="371" y="570" class="chip">CONFIRMED 상태</text>
      <text x="532" y="570" class="heading">+</text>
      <rect x="562" y="542" width="126" height="45" rx="12" fill="#10303e"/>
      <text x="590" y="570" class="chip">go = true</text>
      <text x="708" y="570" class="heading">+</text>
      <rect x="738" y="542" width="170" height="45" rx="12" fill="#10303e"/>
      <text x="765" y="570" class="chip">유효 Depth 표본</text>
      <path d="M930 564h58" fill="none" stroke="#34d399" stroke-width="4" marker-end="url(#arrow)"/>
      <rect x="1002" y="539" width="94" height="51" rx="14" fill="#115e59" stroke="#5eead4" stroke-width="2"/>
      <text x="1022" y="570" class="chip" fill="#f0fdfa">valid</text>
    </g>
    <text x="104" y="618" class="small">저장소에서 데이터 준비, 학습, 평가, 데스크톱 점검, Uno Q 배포 경로와 테스트를 함께 확인할 수 있습니다.</text>

    <text x="1128" y="684" text-anchor="end" class="small">Self-contained portfolio diagram · Sangheon Park</text>
  </g>
</svg>
